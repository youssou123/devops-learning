name: CI Quality Check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js avec Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Simulation du Build
        run: |
          mkdir dist
          echo "Build généré le $(date)" > dist/build-info.txt
          echo "console.log('App ready');" > dist/app.js

      - name: Sauvegarde de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 5

  verify-build:
    runs-on: ubuntu-latest
    needs: build # Ce job ne démarre que si 'build' réussit
    steps:
      - name: Téléchargement de l'artefact généré
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: downloaded-dist/

      - name: Inspection du contenu téléchargé
        run: |
          echo "=== Contenu du dossier téléchargé ==="
          ls -la downloaded-dist/
          echo "=== Fichier build-info.txt ==="
          cat downloaded-dist/build-info.txt
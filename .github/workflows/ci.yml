name: CI Quality Check

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js avec Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      # Génération fictive d'un dossier de distribution (dist)
      - name: Simulation du Build
        run: |
          mkdir dist
          echo "Build généré le $(date)" > dist/build-info.txt
          echo "console.log('App ready');" > dist/app.js

      # Sauvegarde du dossier dist sous forme d'artefact sur GitHub
      - name: Sauvegarde de l'artefact de build
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 5